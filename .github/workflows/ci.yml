name: Python tests and security checks
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,test]"
          python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q agents bfv_integer_agent cli.py enrichment.py simulator.py
      - name: Test Python suite
        run: python -m pytest -q
      - name: Verify CLI entry point
        run: |
          homomorphic-bfv-integer-agent --seed 42 demo --preset toy
          homomorphic-bfv-integer-agent params
      - name: Validate browser JavaScript
        run: node --check web/app.js
      - name: Validate API import
        run: python -c "from agents.api import app; assert app is not None"
