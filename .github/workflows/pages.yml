name: Deploy browser BFV demo
on:
  push:
    branches: [master]
    paths: ["web/**", "bfv_integer_agent/engine.py", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          mkdir -p public
          cp web/index.html web/app.js web/style.css public/
          cp bfv_integer_agent/engine.py public/bfv_engine.py
          touch public/.nojekyll
          test -s public/index.html
          test -s public/bfv_engine.py
          node --check public/app.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
