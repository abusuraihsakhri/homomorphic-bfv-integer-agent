[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "homomorphic-bfv-integer-agent"
version = "2.1.0"
description = "Educational BFV-style integer homomorphic encryption and audit utilities"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Dr. Abu Suraih Sakhri"}]
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.100", "uvicorn>=0.23", "pydantic>=2"]
test = ["pytest>=7", "pydantic>=2"]

[project.scripts]
homomorphic-bfv-integer-agent = "cli:main"
homomorphic-bfv-audit = "bfv_integer_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/homomorphic-bfv-integer-agent"
Repository = "https://github.com/abusuraihsakhri/homomorphic-bfv-integer-agent"

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator", "bfv_integer_agent_app"]

[tool.setuptools.packages.find]
include = ["bfv_integer_agent*", "agents*"]
